<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>შესვლა — Step Railway</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>

<nav>
  <div class="brand">
    <div class="brand-logo"><a href="index.html">SR</a></div>
    <div class="brand-text">
      <span class="brand-name">Step Railway</span>
    </div>
  </div>
  <a href="index.html" class="btn-nav"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> მთავარი</a>
</nav>

<div class="hero" style="min-height:220px; padding-bottom:40px;">
  <div class="hero-text">
    <h1>შესვლა</h1>
    <p class="hero-sub">შედით თქვენს ანგარიშზე</p>
  </div>
</div>

<div class="auth-wrapper">
  <div class="auth-card">
    <h2>მოგესალმებით!</h2>
    <p class="auth-sub">გამოიყენეთ თქვენი ელ. ფოსტა და პაროლი</p>

    <div class="auth-form-group">
      <label>ელ. ფოსტა</label>
      <input type="email" id="email" placeholder="example@mail.com" autocomplete="email"/>
    </div>

    <div class="auth-form-group">
      <label>პაროლი</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>

    <button class="btn-auth-submit" id="signinBtn" onclick="doSignIn()">შესვლა</button>

    <p class="auth-switch">
      ანგარიში არ გაქვთ? <a href="signup.html">რეგისტრაცია</a>
    </p>
  </div>
</div>

<div id="toast" class="toast"></div>


  <script src="auth.js"></script>
  <script src="signin.js"></script>
</body>
</html>
